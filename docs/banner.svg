<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="Local PDF Organizer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <rect width="960" height="260" rx="24" fill="url(#bg)"/>

  <!-- ikon aplikasi -->
  <g transform="translate(56,50)">
    <rect width="160" height="160" rx="36" fill="url(#icon)"/>
    <path d="M52 34h38l28 28v66a8 8 0 0 1-8 8H52a8 8 0 0 1-8-8V42a8 8 0 0 1 8-8z" fill="#fff" fill-opacity="0.95"/>
    <path d="M90 34v28h28" fill="#fecdd3"/>
    <rect x="58" y="80" width="44" height="7" rx="3.5" fill="#f43f5e"/>
    <rect x="58" y="94" width="44" height="7" rx="3.5" fill="#f43f5e"/>
    <rect x="58" y="108" width="28" height="7" rx="3.5" fill="#f43f5e"/>
  </g>

  <!-- judul -->
  <text x="256" y="112" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">Local PDF Organizer</text>
  <text x="258" y="152" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Merge · Organize · Convert · Compress — 100% offline, right on your PC</text>

  <!-- pil teknologi -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="258" y="178" width="78" height="30" rx="15" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-opacity="0.6"/>
    <text x="297" y="198" text-anchor="middle" fill="#fda4af">Tauri 2</text>
    <rect x="346" y="178" width="70" height="30" rx="15" fill="#f97316" fill-opacity="0.18" stroke="#f97316" stroke-opacity="0.6"/>
    <text x="381" y="198" text-anchor="middle" fill="#fdba74">Rust</text>
    <rect x="426" y="178" width="88" height="30" rx="15" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="470" y="198" text-anchor="middle" fill="#7dd3fc">PDFium</text>
    <rect x="524" y="178" width="78" height="30" rx="15" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="563" y="198" text-anchor="middle" fill="#67e8f9">React</text>
    <rect x="612" y="178" width="110" height="30" rx="15" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="667" y="198" text-anchor="middle" fill="#c4b5fd">TypeScript</text>
  </g>
</svg>
