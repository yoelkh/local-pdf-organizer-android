[package]
name = "local-pdf-organizer"
version = "0.2.0"
description = "Pengelola PDF lokal: merge, organize, konversi, kompres"
authors = ["Local PDF Organizer"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.26", features = ["v4", "serde"] }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "image_025"] }
lopdf = "0.44"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["sync", "rt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
